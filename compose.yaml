name: 3Garfos

services:
  webapi:
    build:
      context: .
      dockerfile: src/3Garfos.WebApi/Dockerfile
    ports:
      - 8080:8080
      - 8081:8081
  postegres:
    image: postgres
    restart: always
    shm_size: 128mb
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123Garfos
      POSTGRES_DB: tresgarfos_db
    volumes:
      - postgres-db:/var/lib/postgresql
volumes:
  postgres-db: